[project]
name = "causalops-backend"
version = "0.1.0"
description = "Local synthetic graph foundation for CausalOps"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "falkordb>=1.2,<2",
  "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -ra"
markers = ["integration: requires an isolated real FalkorDB instance"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["falkordb.*", "redis.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true
