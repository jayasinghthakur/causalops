name: causalops
services:
  falkordb:
    image: falkordb/falkordb:v4.22.0
    # The image loads the graph module; Redis persistence is configured via REDIS_ARGS.
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
      BROWSER: "0"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - graph-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "GRAPH.LIST"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: local
      GRAPH_HOST: falkordb
      GRAPH_PORT: "6379"
      GRAPH_NAME: causalops_local
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 20
  falkordb-test:
    image: falkordb/falkordb:v4.22.0
    profiles: ["test"]
    environment:
      REDIS_ARGS: "--appendonly no"
      BROWSER: "0"
    ports:
      - "127.0.0.1:6380:6379"
    tmpfs:
      - /var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "GRAPH.LIST"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  graph-data:
